overrides:
  typescript: npm:@typescript/typescript6@^6.0.2
  # typescript-eslint is a dependency of @1stg/eslint-config; force the whole
  # @typescript-eslint family forward so a single version is in play.
  typescript-eslint: ^8.71.2
  '@typescript-eslint/eslint-plugin': ^8.71.2
  '@typescript-eslint/parser': ^8.71.2
  '@typescript-eslint/project-service': ^8.71.2
  '@typescript-eslint/scope-manager': ^8.71.2
  '@typescript-eslint/type-utils': ^8.71.2
  '@typescript-eslint/types': ^8.71.2
  '@typescript-eslint/typescript-estree': ^8.71.2
  '@typescript-eslint/utils': ^8.71.2
  '@typescript-eslint/visitor-keys': ^8.71.2
  # 10.x ships only `types`/`import` in `exports`, so the `require.resolve`
  # commitlint does on its parser preset fails; 9.x still has a root export.
  conventional-changelog-conventionalcommits: ^10.0.0

# An up-to-date lockfile otherwise short-circuits the install and skips the root
# `prepare`, leaving the git hooks stale.
optimisticRepeatInstall: false

autoInstallPeers: false
strictPeerDependencies: false
enablePrePostScripts: true

# No dependency's install script runs. The only one that would matter is
# `simple-git-hooks`, and the root `prepare` installs the hooks explicitly.
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  nodent-runtime: false
  simple-git-hooks: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.2'
  - '@typescript-eslint/parser@8.71.2'
  - '@typescript-eslint/project-service@8.71.2'
  - '@typescript-eslint/scope-manager@8.71.2'
  - '@typescript-eslint/tsconfig-utils@8.71.2'
  - '@typescript-eslint/type-utils@8.71.2'
  - '@typescript-eslint/types@8.71.2'
  - '@typescript-eslint/typescript-estree@8.71.2'
  - '@typescript-eslint/utils@8.71.2'
  - '@typescript-eslint/visitor-keys@8.71.2'
  - typescript-eslint@8.71.2
