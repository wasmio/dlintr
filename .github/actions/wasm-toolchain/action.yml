name: GHC wasm toolchain
description: >-
  Installs the pinned GHC wasm toolchain and the pinned wasm-opt, natively on
  Linux and macOS and inside WSL2 on Windows. Afterwards `bash
  wasm/build-reactor.sh` works, and `pnpm build:wasm` builds the reactor.

# Four workflows need this, and it was inline YAML in a reusable workflow before,
# which meant it could only be exercised by pushing. The steps here are thin: the
# pins and the install itself are `wasm/toolchain.sh`, which runs on a developer's
# machine too.
#
# Nothing here is allowed to fail quietly. There is no `continue-on-error` and no
# fallback path, because every previous attempt to make this step forgiving on
# this branch produced a green run describing a toolchain that was never
# installed.
runs:
  using: composite
  steps:
    - name: Submodule revision
      id: source
      shell: bash
      run: echo "revision=$(git -C hadolint rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Keyed on the script, which is where the pins now live — one file, so
    # changing a bindist or the optimiser invalidates the cache by construction
    # and a stale toolchain cannot be restored under a key that claims otherwise.
    - name: Cache the toolchain
      if: runner.os != 'Windows'
      id: toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.ghc-wasm
          ~/.ghcup
          ~/.cabal
        key: wasm-toolchain-${{ runner.os }}-${{ hashFiles('wasm/toolchain.sh') }}

    # `GH_TOKEN` is not optional here in practice. `wasm/toolchain.sh` checks the
    # bindist digest against the GitHub API before installing, and the anonymous
    # allowance is per IP — a dozen legs plus three other workflows sharing runner
    # addresses exhaust it and the API answers 403. That cost a red macOS leg.
    - name: Install the toolchain
      if: runner.os != 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash wasm/toolchain.sh

    # macOS 26 ships `jq` and `zstd` but not `xz`, and `setup.sh` reaches for all
    # three. Homebrew is on the runner, so install whatever is missing here rather
    # than let the precondition check in `wasm/toolchain.sh` fail four legs.
    #
    # It is not done in the script: that script is also what a developer runs on
    # their own machine, and installing packages unasked would be rude there.
    # Only the missing ones are installed, so this is a no-op when nothing is.
    - name: Install macOS build tools
      if: runner.os == 'macOS' && steps.toolchain.outputs.cache-hit != 'true'
      shell: bash
      run: |
        for tool in jq unzip xz zstd; do
          command -v "$tool" > /dev/null || brew install "$tool"
        done

    # Only `dist-newstyle`, and a hit does **not** skip the build. Seeding the
    # incremental state is the point; skipping the compile would hide exactly the
    # compile errors the build exists to surface.
    #
    # Keyed on the submodule revision and the recipe. `wasm/toolchain.sh` is in
    # that list because the pins live there now: the optimiser decides the bytes
    # of the artifact, so a change to the pinned binaryen has to move this key
    # just as much as a change to the cabal file does.
    - name: Cache the build
      if: runner.os != 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          hadolint/dist-newstyle
          wasm/hadolint-wasi/dist-newstyle
        key: wasm-build-${{ runner.os }}-${{ steps.source.outputs.revision }}-${{ hashFiles('wasm/toolchain.sh', 'wasm/build-reactor.sh', 'wasm/hadolint-wasi/**') }}

    # GHC's wasm backend has no Windows bindist, so the build runs inside WSL2
    # here. WSL2 only exists on images newer than 2022 — `windows-2022` has WSL1
    # and GitHub closed the WSL2 request for it as won't-fix — and the workflows
    # use `windows-latest`, which only ever selects a newer image. If a future
    # image regressed, this step fails; nothing guards it to no-op.
    #
    # There is no distro preinstalled, and installing one takes about 23 seconds.
    - name: Install a WSL distro
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        wsl --install -d Ubuntu --no-launch
        wsl -d Ubuntu -e bash -c "cat /etc/os-release | head -1; uname -sr"

    # A fresh Ubuntu has curl, tar and xz, and is missing jq, make and unzip,
    # which `setup.sh` needs. `wsl` runs as root here, so this needs no sudo.
    #
    # `WSLENV` is how the token crosses into the distro: WSL does not inherit the
    # Windows environment, and the digest check inside needs the same
    # authenticated request the native path gets.
    - name: Install the toolchain in WSL
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $env:WSLENV = "GH_TOKEN"
        wsl -d Ubuntu -e bash -c "apt-get update -qq && apt-get install -y -qq curl git tar jq make unzip xz-utils zstd"
        # D:\a\dlintr\dlintr -> /mnt/d/a/dlintr/dlintr, in PowerShell rather than
        # via `wslpath`, so a Windows path never has to survive `wsl.exe`'s
        # argument handling to be converted.
        $linux = $env:GITHUB_WORKSPACE.Replace('\', '/') -replace '^([A-Za-z]):', { '/mnt/' + $_.Groups[1].Value.ToLower() }
        Write-Host "checkout inside WSL: $linux"
        wsl -d Ubuntu -e bash "$linux/wasm/toolchain.sh"

    # The Windows toolchain is *not* cached. `actions/cache` would have to reach
    # it through the `\\wsl$\Ubuntu\...` share, and that is unverified — tarring
    # several gigabytes across 9p could cost more than the four minutes the
    # install takes. Correctness first: the Windows legs pay a full install every
    # run, and this comment is the record of a trade rather than a claim that
    # caching was considered and found impossible.
