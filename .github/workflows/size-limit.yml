name: Size Limit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  # `pnpm size-limit` runs `pnpm build`, which starts with `check:wasm`, which
  # needs `hadolint.wasm` and its glue in the package root. Nothing fetches them,
  # so this job has to produce them.
  #
  # This workflow only triggers on pull requests to `main`, so it stayed
  # invisible until the first PR was opened — the third consumer of the wasm
  # artifact to be found by a red check rather than by looking for the others.
  wasm:
    name: Build hadolint.wasm
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/wasm.yml

  size-limit:
    runs-on: ubuntu-latest
    needs: wasm
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two files, not one: the module and the glue GHC generates beside it.
      # Without the glue the exports are unreachable.
      - name: Download hadolint.wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hadolint-wasm

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm i

      - uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install
          script: pnpm size-limit --json
