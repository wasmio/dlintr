name: Size Limit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  size-limit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # Deliberately **not** `./.github/actions/wasm-toolchain`, which the other
      # three workflows use, and the reason is worth writing down.
      #
      # `size-limit-action` checks out the base branch to measure it. The base is
      # `main`, which does not have a local action that this pull request adds —
      # so every post step the action owns fails to resolve, after all the real
      # work has already passed:
      #
      #   Can't find 'action.yml' ... under '.github/actions/wasm-toolchain'.
      #   Did you forget to run actions/checkout before running your local action?
      #
      # `actions/cache` is a remote action resolved from the runner's own cache
      # of actions, so it survives that checkout. The duplication below is the
      # price of a measurement step that moves the worktree out from under the
      # thing that is measuring it.
      - name: Cache the toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.ghc-wasm
            ~/.ghcup
            ~/.cabal
          key: wasm-toolchain-${{ runner.os }}-${{ hashFiles('wasm/toolchain.sh') }}

      - name: Install the wasm toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        env:
          # The script checks the bindist digest against the GitHub API, and the
          # anonymous allowance is per IP.
          GH_TOKEN: ${{ github.token }}
        run: bash wasm/toolchain.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: pnpm i

      # The action runs the build before measuring, and the build includes
      # `build:wasm`. The toolchain above has to be in place for that, which is
      # why this is not simply a bundle-size check.
      - uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install
          script: pnpm size-limit --json
