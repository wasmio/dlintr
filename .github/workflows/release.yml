name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A publish that has started must finish.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Opens or updates the version PR, and decides whether this run should publish.
  #
  # `changesets/action` reports `has-changesets`: true while unreleased changesets
  # exist, in which case it opens the version PR; false once that PR is merged.
  # False alone does not mean "publish" — a re-run of `main`, or a publish that
  # failed halfway, leaves the version already on npm — so the registry is asked
  # directly. That is the difference between "nothing to version" and "something
  # to publish".
  release:
    name: Version or prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.package-version.outputs.publish }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets needs history for changelogs and the version PR branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm i

      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          commit-message: 'chore: release dlintr'
          pr-title: 'chore: release dlintr'

      - name: Is this version already on npm?
        id: package-version
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          encoded_name=${name//\//%2f}
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://registry.npmjs.org/${encoded_name}/${version}")
          case "$status" in
            200)
              echo "${name}@${version} is already published; nothing to do."
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "${name}@${version} is not published yet."
              ;;
            *)
              echo "npm registry answered ${status} for ${name}@${version}" >&2
              exit 1
              ;;
          esac

  # The tarball has to contain the wasm, and `pnpm build` packs it, so it must
  # exist before the publish job runs.
  wasm:
    name: Build hadolint.wasm
    needs: release
    if: needs.release.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/wasm.yml

  publish:
    name: Publish to npm
    # No `if`: a job that needs a skipped or failed job is skipped by default,
    # which is the gate wanted here. `wasm` only runs when there is something to
    # publish, and `pnpm build` exits 0 without the wasm — measured — so a failed
    # build must not reach the publish.
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download hadolint.wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hadolint-wasm

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm i

      # Packs `hadolint.wasm` into the tarball. Kept out of the publish step so
      # the action parses publish output only, not build output.
      - name: Build
        run: pnpm build

      - name: Publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
