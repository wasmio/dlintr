name: Release

on:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  # There is no separate build job and no `detect` gate any more. `wasm.yml` used
  # to build the module ahead of this one so `pnpm build` could pack it; now
  # `pnpm release` runs the `prerelease` hook, `pnpm build`, which builds the
  # module as part of packing. Nothing is needed beforehand, and the version-PR
  # path never builds anything because it only runs `changeset version`.
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # provenance signing
      attestations: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
          submodules: true

      - name: Install the wasm toolchain
        uses: ./.github/actions/wasm-toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: pnpm i

      # `pnpm release` runs the `prerelease` hook, which is `pnpm build`, which
      # packs `hadolint.wasm` into the npm tarball — and which builds it first, so
      # a publish cannot ship a package with no binary in it. Nothing is attached
      # to the release: the tarball is the delivery, and it is the
      # content-addressed, immutable one.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm run version
          commit-message: 'chore: release dlintr'
          pr-title: 'chore: release dlintr'

      # After the publish, not before, and that ordering is forced: the build is
      # not byte-reproducible, so building the module early to attest it and
      # letting `prerelease` build it again would sign a file that is not the one
      # packed. The file still on disk here is the one that went into the tarball.
      #
      # Skipped on the version-PR path, where nothing was built and nothing was
      # published — `subject-path` on a missing file would fail the run.
      - name: Attest the published module
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: hadolint.wasm
