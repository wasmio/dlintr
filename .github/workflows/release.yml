name: Release

on:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  # `changesets/action` publishes only when no changesets are left, which is
  # what a merged version PR looks like; otherwise it opens that PR. The wasm is
  # needed for the first case and not the second, and it takes a toolchain
  # install to produce, so decide before spending anything on it.
  detect:
    name: Is this a publish?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for unreleased changesets
        id: check
        run: |
          if compgen -G '.changeset/*.md' | grep -qv 'README.md'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # The binary has to exist before `pnpm release` runs, because `pnpm build`
  # packs it into the npm tarball. So build it here rather than downloading it
  # from a release that does not exist yet — the tag for this version is created
  # by the very step below.
  wasm:
    name: Build hadolint.wasm
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/wasm.yml

  release:
    name: Release
    needs:
      - detect
      - wasm
    # `always()` because a skipped `wasm` — the version-PR path — must not skip
    # the release, which is the case that does not need a binary at all.
    #
    # A *failed* `wasm` is a different thing, and it must stop the publish. That
    # hole was wide open: the download below is skipped when `wasm` did not
    # succeed, `pnpm build` no longer needs a binary to succeed, and `pnpm pack`
    # then packs a tarball without one and exits 0 — measured, not reasoned. The
    # package would have shipped with no wasm in it and every check green.
    if: >-
      always() && needs.detect.result == 'success' &&
      (needs.detect.outputs.publish == 'false' || needs.wasm.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Download hadolint.wasm
        if: needs.wasm.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hadolint-wasm

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm i

      # `pnpm release` runs the `prerelease` hook, which is `pnpm build`, which
      # packs `hadolint.wasm` into the npm tarball. The two files were downloaded
      # above, and `needs: wasm` is what guarantees them: a publish that somehow
      # lost its artifact never reaches here.
      #
      # Nothing is attached to the release. The tarball is the delivery, and it
      # is the content-addressed, immutable one; a second copy on the release
      # would only be npm's copy again, in a place nothing fetches from.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm run version
          commit-message: 'chore: release dlintr'
          pr-title: 'chore: release dlintr'
