name: Publish Any Commit

on:
  push:
    # `changesets/action` v2 pushes through the GitHub API, which first creates a transient
    # `changesets-ghcommit-temp/<branch>` ref; CI on that ref only produces runs that cancel each
    # other and cancelled checks attached to the real commit
    branches-ignore:
      - 'changesets-ghcommit-temp/**'
    # a push filter that only sets `branches-ignore` also stops running for tags
    tags:
      - '**'
  pull_request: {}

concurrency:
  # give each main commit its own group, so a later push can neither cancel nor replace its run
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # `pnpm build` runs `build:wasm`, which needs `hadolint.wasm` in the package
  # root. Build it here too rather than letting that step try to fetch one: on a
  # fresh checkout there is nothing published to fetch, and the whole point is
  # that the binary is ours. The cache means this is a hit whenever `ci.yml` has
  # already built the same revision.
  wasm:
    name: Build hadolint.wasm
    permissions:
      id-token: write
      attestations: write
    uses: ./.github/workflows/wasm.yml

  publish:
    runs-on: ubuntu-latest
    needs: wasm

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download hadolint.wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hadolint-wasm

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: pnpm i

      - name: Build
        run: pnpm build
        env:
          HADOLINT_WASM_SKIP_FETCH: '1'

      - name: Publish
        run: pnpm dlx pkg-pr-new publish --pnpm
