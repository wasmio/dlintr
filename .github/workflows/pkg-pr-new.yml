name: Publish Any Commit

on:
  push:
    # `changesets/action` v2 pushes through the GitHub API, which first creates a transient
    # `changesets-ghcommit-temp/<branch>` ref; CI on that ref only produces runs that cancel each
    # other and cancelled checks attached to the real commit
    branches-ignore:
      - 'changesets-ghcommit-temp/**'
    # a push filter that only sets `branches-ignore` also stops running for tags
    tags:
      - '**'
  pull_request: {}

concurrency:
  # give each main commit its own group, so a later push can neither cancel nor replace its run
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance signing
      attestations: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install the wasm toolchain
        uses: ./.github/actions/wasm-toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: pnpm i

      # `pnpm build` builds the reactor as part of packing it, so there is no
      # artifact to download and nothing to fetch from a release that does not
      # exist yet on a first run.
      - name: Build
        run: pnpm build

      # Fork pull requests get a read-only token, so signing is not available.
      - name: Attest Build Provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: hadolint.wasm

      - name: Publish
        run: pnpm dlx pkg-pr-new publish --pnpm
