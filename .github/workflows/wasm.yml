name: WASM

# Builds `hadolint.wasm` from the `vendor/hadolint` submodule.
#
# This is the only place the binary comes from. It is `workflow_call`-able so
# that `ci.yml` can obtain the artifact in the same run — a fresh checkout, and
# a first ever CI run, therefore need no pre-existing release and no binary from
# any other project. `workflow_dispatch` with `publish` puts the result on the
# `hadolint-wasm` release, which is what developers' `pretest` fetches.
#
# The toolchain and the build are cached under a key derived from the submodule
# commit and this recipe, so the expensive path runs when the inputs change and
# not on every push.
on:
  workflow_call: {}
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the result to the `hadolint-wasm` release
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/workflows/wasm.yml
      - .gitmodules
      - vendor/hadolint
      - wasm/**

# A build only matters if it is the newest one. `github.workflow` is the name of
# the *caller*, which keeps this from being two workflows that both need the
# artifact on the same commit — CI and the preview publish, say — cancelling
# each other's build and leaving one of them with nothing to download.
concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  # Only supersede on pull requests. Cancelling an in-flight build on a branch
  # that is being iterated on throws away a twenty-minute toolchain install to
  # save a typo fix — precisely when the result is worth most.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build hadolint.wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishing to the release, on manual dispatch
      id-token: write # provenance signing
      attestations: write
    env:
      # Pinned known-good toolchain. The channel default cannot build hadolint at
      # all: GHC emits ELF-flavoured assembly for the `Diff` dependency
      # (`.section .text,"ax",@progbits`) and wasm32-wasi-clang rejects it with
      # "Wasm doesn't support data symbols in text sections".
      #
      # `setup.sh` reads the bindist URL out of `autogen.json` in whichever
      # ghc-wasm-meta revision it runs from, so pinning the revision is what
      # pins the compiler *and* the clang it was built against. Master has moved
      # on to a newer bindist, hence naming a revision at all.
      GHC_WASM_META_REV: 60098a5076557e327b326a1a3ba3b5fb4fec1e49
      GHC_WASM_BINDIST_TAG: 20260403T135157
      GHC_WASM_BINDIST_URL: https://github.com/haskell-wasm/ghc-wasm-bindists/releases/download/20260403T135157/wasm32-wasi-ghc-9.10.tar.xz
      GHC_WASM_BINDIST_SHA256: 60d0e537548a82590fd6cfd6eaec5ceba0bc58bf320a6f491843a1cf4403bce8
      # A pinned optimiser, because `wasm-opt` decides the bytes of the artifact:
      # a floating one would make the digest pinned in the package meaningless.
      BINARYEN_URL: https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
      BINARYEN_DIR: binaryen-version_133
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Submodule Revision
        id: source
        run: echo "revision=$(git -C vendor/hadolint rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Restores the GHC wasm toolchain, the Haskell dependency build and the
      # artifact itself. A hit means this job only has to re-run the smoke test.
      - name: Cache Toolchain and Build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.ghc-wasm
            ~/.ghcup
            ~/.cabal
            vendor/hadolint/dist-newstyle
            hadolint.wasm
          key: wasm-${{ runner.os }}-${{ steps.source.outputs.revision }}-${{ hashFiles('wasm/**', '.github/workflows/wasm.yml') }}

      - name: Install System Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-gold \
            curl \
            g++ \
            gcc \
            git \
            gzip \
            jq \
            libc-dev \
            libffi-dev \
            libgmp-dev \
            libncurses-dev \
            make \
            musl \
            musl-dev \
            musl-tools \
            perl \
            tar \
            xz-utils \
            zlib1g \
            zlib1g-dev

      - name: Install binaryen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o binaryen.tar.gz "$BINARYEN_URL"
          echo "$BINARYEN_SHA256  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz
          echo "$PWD/$BINARYEN_DIR/bin" >> "$GITHUB_PATH"

      - name: Install pinned GHC wasm toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # `gh api` below needs it; it is not picked up implicitly.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail legibly if the pinned bindist has been retired — it is a release
          # asset and can be deleted. Deliberately no fallback: the channel
          # default is the compiler that cannot build hadolint.
          curl -fsIL --retry 3 "$GHC_WASM_BINDIST_URL" > /dev/null || {
            echo "::error::the pinned GHC wasm bindist is gone: $GHC_WASM_BINDIST_URL"
            echo "::error::re-pin deliberately rather than falling back to the channel default"
            exit 1
          }

          # A full clone: the pin is a specific older revision.
          git clone https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta.git
          git -C ghc-wasm-meta checkout "$GHC_WASM_META_REV"

          # `setup.sh` is driven entirely by this file, so check the revision
          # agrees with us before spending ten minutes installing.
          actual="$(jq -r '."wasm32-wasi-ghc-9.10".url' ghc-wasm-meta/autogen.json)"
          if [ "$actual" != "$GHC_WASM_BINDIST_URL" ]; then
            echo "::error::ghc-wasm-meta@$GHC_WASM_META_REV pins $actual, expected $GHC_WASM_BINDIST_URL"
            exit 1
          fi

          # `setup.sh` downloads into a `mktemp -d` that it deletes on exit, so
          # the tarball cannot be hashed after the fact. Pin by hash anyway:
          # compare the release asset's own digest — GitHub computes it at
          # upload — against the value recorded here. A replaced asset fails
          # here rather than quietly becoming the compiler we build with.
          published="$(gh api "repos/haskell-wasm/ghc-wasm-bindists/releases/tags/$GHC_WASM_BINDIST_TAG" \
            --jq '.assets[] | select(.name == "wasm32-wasi-ghc-9.10.tar.xz") | .digest')"
          if [ "sha256:$GHC_WASM_BINDIST_SHA256" != "$published" ]; then
            echo "::error::bindist digest is '$published', expected 'sha256:$GHC_WASM_BINDIST_SHA256'"
            exit 1
          fi

          FLAVOUR=9.10 ghc-wasm-meta/setup.sh

      # Deliberately before the real build, and the most informative step in this
      # workflow: if the published toolchain cannot compile a one-line program,
      # then it cannot compile any Haskell and the fault is not our cabal
      # invocation. It also prints the compiler, its C toolchain and its boot
      # library versions, because `base`/`text` decide whether hadolint's bounds
      # are even satisfiable.
      - name: Probe Toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          source ~/.ghc-wasm/env

          echo "::group::which"
          for tool in ghc wasm32-wasi-ghc wasm32-wasi-ghc-pkg wasm32-wasi-cabal clang wasm32-wasi-clang wasmtime; do
            printf '%-22s %s\n' "$tool" "$(command -v "$tool" || echo '(absent)')"
          done
          echo "::endgroup::"

          libdir="$(wasm32-wasi-ghc --print-libdir)"
          echo "wasm32-wasi-ghc: $(wasm32-wasi-ghc --version)"
          echo "libdir:          $libdir"

          echo "::group::settings (the C toolchain it will actually drive)"
          grep -E '^("C compiler command"|"cc"|"ld command"|"ar command"|"target platform"|"C compiler flags"|"Cxx compiler flags"|"C preprocessor flags")' \
            "$libdir/settings" || true
          echo "::endgroup::"

          echo "::group::boot libraries"
          wasm32-wasi-ghc-pkg list --simple-output 2> /dev/null \
            | tr ' ' '\n' | grep -E '^(base|text|bytestring|containers)-' || true
          echo "::endgroup::"

          # Two hello worlds, deliberately. "the compiler alone works, cabal does
          # not" and "neither works" point at completely different culprits, and
          # one probe cannot tell them apart. The assembler error we are chasing
          # is also suspiciously PIC-shaped, so if only the cabal one fails, the
          # next thing to read is what flags cabal is adding.
          run_wasm() {
            if command -v wasmtime > /dev/null; then
              wasmtime "$1"
            else
              echo "wasmtime is not on PATH, not running it"
            fi
          }

          echo "::group::hello world, direct with wasm32-wasi-ghc"
          printf 'main = putStrLn "hi"\n' > "$RUNNER_TEMP/hello.hs"
          wasm32-wasi-ghc "$RUNNER_TEMP/hello.hs" -o "$RUNNER_TEMP/hello.wasm"
          ls -l "$RUNNER_TEMP/hello.wasm"
          run_wasm "$RUNNER_TEMP/hello.wasm"
          echo "::endgroup::"

          echo "::group::hello world, through wasm32-wasi-cabal"
          probe="$RUNNER_TEMP/probe-hello"
          mkdir -p "$probe"
          printf 'main = putStrLn "hi"\n' > "$probe/Main.hs"
          printf 'cabal-version: 2.4\nname: probe-hello\nversion: 0\nbuild-type: Simple\n\nexecutable probe-hello\n  main-is: Main.hs\n  build-depends: base\n  default-language: GHC2021\n' \
            > "$probe/probe-hello.cabal"
          (cd "$probe" && wasm32-wasi-cabal build exe:probe-hello)
          probe_bin="$(cd "$probe" && wasm32-wasi-cabal list-bin exe:probe-hello)"
          ls -l "$probe_bin"
          run_wasm "$probe_bin"
          echo "::endgroup::"

      - name: Build hadolint.wasm
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          source ~/.ghc-wasm/env

          # setup.sh installs a binaryen of its own from the same autogen.json;
          # put the pinned one first so the artifact's bytes stay reproducible.
          export PATH="$PWD/$BINARYEN_DIR/bin:$PATH"
          wasm-opt --version
          case "$(wasm-opt --version)" in
            *"version 133"*) ;;
            *)
              echo "::error::expected the pinned wasm-opt 133, got: $(wasm-opt --version)"
              exit 1
              ;;
          esac

          bash wasm/build.sh

      # A module that links but cannot start is the failure worth catching, so
      # this really runs it. See wasm/smoke.mjs.
      - name: Smoke Test
        run: node wasm/smoke.mjs hadolint.wasm

      - name: Checksum
        id: wasm
        run: |
          digest="$(sha256sum hadolint.wasm | tee hadolint.wasm.sha256 | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### hadolint.wasm"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| hadolint | \`$(git -C vendor/hadolint describe --tags --always)\` |"
            echo "| size | \`$(du -h hadolint.wasm | cut -f1)\` |"
            echo "| sha256 | \`$digest\` |"
            echo
            echo "Put this sha256 in \`HADOLINT_SHA256\` in"
            echo "\`scripts/hadolint-wasm.mjs\` after publishing, so that"
            echo "\`pretest\` fetches a verified artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      # Fork pull requests get a read-only token, so signing is not available.
      - name: Attest Build Provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: hadolint.wasm

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hadolint-wasm
          path: |
            hadolint.wasm
            hadolint.wasm.sha256
          if-no-files-found: error

      - name: Publish to the `hadolint-wasm` Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hadolint-wasm >/dev/null 2>&1 || gh release create hadolint-wasm \
            --prerelease \
            --title 'hadolint.wasm' \
            --notes 'WASI builds of hadolint, produced by the WASM workflow. These are build artifacts, not releases of the package.'
          gh release upload hadolint-wasm hadolint.wasm hadolint.wasm.sha256 --clobber
