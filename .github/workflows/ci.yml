name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  # The byte-for-byte format check compares the reactor against the *command*
  # build from the same commit. Something has to build that command, and it is
  # the expensive half — hadolint's whole dependency tree, linked a second way —
  # so it is built once, here, and not in each of the twelve matrix legs.
  #
  # One job on one platform is all it needs: a wasm module is host-independent.
  # The twelve legs build the *reactor* each, because that is what the package
  # ships and what the runtime loads, but the reference exists only for this one
  # test.
  command-reference:
    name: Command reference and format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install the wasm toolchain
        uses: ./.github/actions/wasm-toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm i

      - name: Build the command reference
        run: bash wasm/build.sh hadolint-cli.wasm

      # A module that links but cannot start is the failure worth catching, so
      # this really runs it. See wasm/smoke.mjs.
      - name: Smoke test the command reference
        run: node wasm/smoke.mjs hadolint-cli.wasm

      - name: Build the reactor
        run: pnpm build:wasm

      # `DLINTR_REQUIRE_CLI` turns "no reference on disk" into a failure instead
      # of a skipped test. It is set here and nowhere else, because this is the
      # only job that has the file — and a skip anywhere else is deliberate and
      # says so in the log.
      - name: Test
        run: pnpm test
        env:
          DLINTR_REQUIRE_CLI: '1'

  ci:
    name: Lint and Test with Node.js ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      # `fail-fast: false` stood here while the WASM matrix was being
      # stabilised: a single failing job was cancelling the other eleven and
      # hiding Windows, macOS and the remaining Node versions. It came out again
      # once all twelve were green, because the default is what is wanted in
      # normal operation.
      #
      # The matrix now builds the reactor in every leg rather than downloading
      # it, so a Windows leg does real work — including installing a WSL distro.
      # That is still not a reason to soften this: a leg that fails is the leg to
      # read, and the platform that broke is visible without the other eleven
      # pretending to have run.
      matrix:
        node:
          - 20
          - 22
          - 24
          - 26
        os:
          - macos-latest
          # `windows-latest`, deliberately not a pinned `windows-2025`.
          #
          # GHC's wasm backend has no Windows bindist, so the reactor is built
          # inside WSL2 here. WSL2 only exists on images newer than 2022:
          # `windows-2022` has WSL1, and GitHub closed the request for WSL2 on it
          # as won't-fix (`actions/runner-images` #10563, "not all Windows 2022
          # fleet support WSL 2").
          #
          # That argues for `-latest` rather than against it. The risk belongs to
          # *pinned older* images, and `-latest` never selects one — it tracks
          # forward, so every image it can pick has WSL2, while pinning 2025 would
          # freeze us on an image that will eventually be retired. If a future
          # image ever regressed, the Windows leg fails loudly here; nothing
          # guards the build to no-op when WSL is missing, on purpose.
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install the wasm toolchain
        uses: ./.github/actions/wasm-toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # `cache: pnpm` was set here before. setup-node logged `pnpm cache is not
      # found`, then `Path(s) specified in the action for caching do(es) not
      # exist` in its post step, which failed the job after every real step had
      # passed. Nothing was ever cached, so it only ever produced a red job.
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install Dependencies
        run: pnpm i

      # `pnpm build` includes `build:wasm`, which on Windows goes through WSL and
      # copies the module and its glue back into this workspace — so the tests
      # below are running natively against a module built on Linux.
      - name: Build, Lint and Test
        run: pnpm run-s build lint test
        env:
          EFF_NO_LINK_RULES: true
          PARSER_NO_WATCH: true

      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
