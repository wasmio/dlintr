name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  # The WASI binary the suite runs against, built once and handed to every
  # matrix job below. Producing it is the `WASM` workflow's job, so the sixteen
  # test jobs share one toolchain and one build, and CI never has to fetch a
  # binary from outside this repository.
  wasm:
    name: Build hadolint.wasm
    # A called workflow cannot use more permissions than its caller grants, and
    # requesting more than it is given fails the entire run at startup — before
    # a single job exists to show why. These are scoped to this job so that the
    # test matrix below keeps the workflow's default `contents: read`.
    permissions:
      contents: read
      id-token: write # provenance signing
      attestations: write
    uses: ./.github/workflows/wasm.yml

  ci:
    name: Lint and Test with Node.js ${{ matrix.node }} on ${{ matrix.os }}
    needs: wasm
    # The `wasm` job builds the command artifact first and the reactor last, and
    # only the reactor is allowed to fail the job. `always()` keeps the suite
    # running against the artifact that was already uploaded, rather than a
    # reactor compile error skipping every test. If the artifact genuinely is
    # missing, the download below fails and says so.
    if: always()
    strategy:
      matrix:
        node:
          - 20
          - 22
          - 24
          - 26
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Put `hadolint.wasm` in the package root, where the runtime and the tests
      # expect it.
      - name: Download hadolint.wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hadolint-wasm

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # `cache: pnpm` was set here before. setup-node logged `pnpm cache is not
      # found`, then `Path(s) specified in the action for caching do(es) not
      # exist` in its post step, which failed the job after every real step had
      # passed. Nothing was ever cached, so it only ever produced a red job.
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install Dependencies
        run: pnpm i

      - name: Build, Lint and Test
        run: pnpm run-s build lint test
        env:
          EFF_NO_LINK_RULES: true
          # `build:wasm` and `pretest` both run scripts/hadolint-wasm.mjs. The
          # artifact is already in place here, so tell it not to fetch one.
          HADOLINT_WASM_SKIP_FETCH: '1'
          PARSER_NO_WATCH: true

      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
